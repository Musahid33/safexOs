<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Offline — Safex</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:Arial,sans-serif;text-align:center;padding:24px}.card{max-width:340px}.icon{font-size:56px;margin-bottom:16px}h1{font-size:20px;font-weight:900;margin-bottom:8px}p{font-size:13px;color:#94a3b8;line-height:1.6}.btn{display:inline-block;margin-top:20px;background:#f59e0b;color:#0f172a;font-weight:800;font-size:13px;padding:11px 22px;border-radius:10px;border:0;cursor:pointer}</style></head><body><div class="card"><div class="icon">📡</div><h1>You're offline</h1><p>No network connection. The app keeps working offline once opened — go back and continue.</p><p style="margin-top:10px">Reports are saved offline and auto-sync when the network is back. ✅</p><button class="btn" onclick="history.back()">← Go Back</button> <button class="btn" style="background:#334155;color:#fff;margin-left:8px" onclick="location.reload()">Retry</button></div></body></html>
