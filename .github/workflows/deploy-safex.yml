name: Deploy Safex (Vercel Production)

on:
  push:
    branches: [main]
    paths:
      - "safex/**"
      - ".github/workflows/deploy-safex.yml"
  workflow_dispatch:

concurrency:
  group: deploy-safex-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy safex/ to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify VERCEL_TOKEN secret exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Secret VERCEL_TOKEN is not set. Add it at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            exit 1
          fi
          echo "VERCEL_TOKEN is present."

      - name: Ensure Vercel project 'safex' exists
        working-directory: safex
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest project add safex --token "$VERCEL_TOKEN" || echo "Project likely already exists — continuing."

      - name: Deploy to production
        id: deploy
        working-directory: safex
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          npx --yes vercel@latest deploy --prod --yes --project safex --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9][a-z0-9-]*\.vercel\.app' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::warning::Could not parse deployment URL from output."
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Safex deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment URL
        if: steps.deploy.outputs.url
        run: 'echo "Live at: ${{ steps.deploy.outputs.url }}"'
