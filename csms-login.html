<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Safex CSMS Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f1f5f9;color:#0f172a;font:14px Arial,sans-serif}.top{background:#0f172a;color:#fff;border-bottom:3px solid #f59e0b;padding:14px 18px}.top small{color:#fbbf24;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.top h1{margin:5px 0 0;font-size:20px}.wrap{max-width:760px;margin:auto;padding:22px 14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 24px #0f172a12;padding:22px}.login{max-width:390px;margin:45px auto}.label{display:block;color:#64748b;font-size:10px;font-weight:800;text-transform:uppercase;margin:13px 0 5px}.input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;font-size:12px;cursor:pointer}.btn-primary{background:#2563eb;color:white;width:100%;margin-top:18px}.btn-primary:hover{background:#1d4ed8}.btn-home{background:#e2e8f0;color:#334155}.hub{display:none}.hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.hub-btn{min-height:145px;border:0;border-radius:15px;padding:18px;text-align:left;color:#fff;cursor:pointer;box-shadow:0 8px 20px #0f172a18}.hub-btn:hover{transform:translateY(-2px)}.hub-btn b{display:block;font-size:15px;margin:30px 0 6px}.hub-btn span{font-size:10px;color:#dbeafe}.audit{background:linear-gradient(135deg,#7c3aed,#312e81)}.docs{background:linear-gradient(135deg,#2563eb,#1e3a8a)}.home{background:linear-gradient(135deg,#059669,#064e3b)}.error{color:#dc2626;font-size:11px;font-weight:700;margin-top:10px}@media(max-width:620px){.hub-grid{grid-template-columns:1fr}.hub-btn{min-height:105px}.hub-btn b{margin:10px 0 5px}}
</style></head>
<body>
<header class="top"><small>Safex • EMVEESS Infraventures Pvt. Ltd.</small><h1>CSMS Login & Control Hub</h1></header>
<main class="wrap">
<section id="loginCard" class="card login"><h2 style="margin:0 0 5px">🔐 CSMS Login</h2><p style="color:#64748b;font-size:12px;margin:0">Authorized Safety Officer access</p><label class="label">Officer User ID</label><input id="csmsUser" class="input" placeholder="TSL-OFF-01" autocomplete="username"><label class="label">Password</label><input id="csmsPass" class="input" type="password" placeholder="Enter password" autocomplete="current-password"><button class="btn btn-primary" onclick="loginCsms()">Login to CSMS</button><p id="loginError" class="error"></p><button class="btn btn-home" style="margin-top:12px;width:100%" onclick="location.href='index.html'">← Safex Home</button></section>
<section id="hub" class="hub"><div class="card"><h2 style="margin:0 0 5px">CSMS Control Hub</h2><p id="welcome" style="color:#64748b;font-size:12px;margin:0">Choose a module to continue.</p><div class="hub-grid"><button class="hub-btn home" onclick="location.href='index.html'"><span>🏠 HOME</span><b>Safex Home</b><span>Return to the main safety portal</span></button><button class="hub-btn audit" onclick="location.href='csms-dashboard.html'"><span>✅ AUDIT</span><b>CSMS Internal Audits</b><span>Open the Annexure #8 annual audit checklist</span></button></div><button class="btn btn-home" style="margin-top:18px" onclick="logoutCsms()">Sign out</button></div></section>
</main>
<script>
const supabaseUrl='https://ixfwhxjtajmrdndhtsub.supabase.co';const supabaseKey='sb_publishable_PaR8QjtqO9nq593ekRfg7Q_PzsOCg2-';const db=window.supabase.createClient(supabaseUrl,supabaseKey);
async function loginCsms(){const user=document.getElementById('csmsUser').value.trim();const pass=document.getElementById('csmsPass').value;const error=document.getElementById('loginError');error.textContent='';if(!user||!pass){error.textContent='Enter User ID and Password.';return}try{const {data, error:dbError}=await db.from('vault_officers').select('user_id,name,plant').eq('user_id',user).eq('password',pass).maybeSingle();if(dbError)throw dbError;if(!data){error.textContent='Invalid CSMS User ID or Password.';return}sessionStorage.setItem('csms_user',data.user_id);document.getElementById('welcome').textContent=`Welcome ${data.name||data.user_id} • ${data.plant||'CSMS Officer'}`;document.getElementById('loginCard').style.display='none';document.getElementById('hub').style.display='block'}catch(e){error.textContent='Login could not be verified: '+e.message}}
function logoutCsms(){sessionStorage.removeItem('csms_user');location.reload()}
if(sessionStorage.getItem('csms_user')){document.getElementById('loginCard').style.display='none';document.getElementById('hub').style.display='block';document.getElementById('welcome').textContent='CSMS session active.'}
</script></body></html>
