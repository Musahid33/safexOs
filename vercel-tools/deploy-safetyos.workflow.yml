# Optional workflow template. Enable only after configuring a SEPARATE SafetyOS project.
# Copy to .github/workflows/deploy-safetyos.yml when the owner is ready.
name: Deploy SafetyOS (separate project)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-safetyos-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix safetyos --include=dev --ignore-scripts
      - run: npm ci --prefix vercel-tools --ignore-scripts
      - name: Deploy SafetyOS, never Safex
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SAFETYOS_VERCEL_PROJECT_ID: ${{ vars.SAFETYOS_VERCEL_PROJECT_ID }}
          SAFETYOS_VERCEL_ORG_ID: ${{ vars.SAFETYOS_VERCEL_ORG_ID }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: bash vercel-tools/deploy.sh production
